[package]
name = "warden-desktop"
version = "0.2.0"
description = "warden 桌面版(多节点进程监护管理)"
authors = ["viccom"]
edition = "2021"

[lib]
# `_lib` 后缀避免与 bin 名冲突(Windows 限制,见 rust-lang/cargo#8519)
name = "warden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建特性:启用内嵌前端资源(custom protocol)。`cargo tauri build` 自动开启;
# 裸 `cargo build` 不带此特性 → exe 运行时加载 devUrl(开发服务器)而非内嵌资源 → 白屏。
# 对齐官方 create-tauri-app 模板约定,DO NOT REMOVE。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 复用 CLI 版监护引擎/HTTP API(与本 crate 同仓库)
warden = { path = "../.." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.3"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 钉 24.04 而非 latest:runner 2026-10-19 起 ubuntu-latest 自动迁移
        # Ubuntu 26,钉版避免工具链/系统库随镜像漂移引入不可预期红灯
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Tauri v2 Linux 前置(warden-desktop 参与 --workspace 编译/测试)
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # 反向代理 feature OFF 形态回归(D8:配置解析无条件,引擎门控;
      # default 已含 reverse-proxy,故 ON 形态由上方常规步骤覆盖)
      - name: clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: test (no default features)
        run: cargo test --workspace --no-default-features

[package]
name = "warden"
default-run = "warden"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "A process supervisor daemon (supervisord/pm2-style) for the edge"
repository = "https://github.com/viccom/warden"
readme = "README.md"

# 桌面版(Tauri 2)是 workspace 成员;根命令(cargo build/test)默认仍只作用于本 crate。
# 桌面版构建:cd desktop && pnpm tauri build(或 cargo build -p warden-desktop)
[workspace]
members = ["desktop/src-tauri"]

[lib]
name = "warden"
path = "src/lib.rs"

[[bin]]
name = "warden"
path = "src/main.rs"

# 测试辅助二进制(被 warden 作为被监护进程启动,验证优雅停止信号链路)
[[bin]]
name = "graceful_target"
path = "tests/helpers/graceful_target.rs"

# 测试辅助二进制:向 stdout 输出 GBK 编码中文,验证 output_encoding 解码
[[bin]]
name = "gbk_target"
path = "tests/helpers/gbk_target.rs"

# 测试辅助二进制:启动/停止时向 stamp 文件追加标记,验证有序启停(优先级)
[[bin]]
name = "stamp_target"
path = "tests/helpers/stamp_target.rs"

# 测试辅助二进制:绑定随机 TCP/UDP 端口并自报,验证监听端口发现
[[bin]]
name = "port_listener_target"
path = "tests/helpers/port_listener_target.rs"

# 诊断二进制:打印 crossterm 读到的按键事件(定位 TUI 方向键无响应)
[[bin]]
name = "keys_probe"
path = "tests/helpers/keys_probe.rs"

[dependencies]
# 与 rs-iot 同版本栈,便于统一维护
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 配置文件文档级编辑(CRUD 写回唯一数据源;保注释/排版,与 toml 0.8 同源版本)
toml_edit = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
sysinfo = "0.32"
directories = "5"
# 子进程输出编码解码(GBK/CP936 等中文编码),Phase 2
encoding_rs = "0.8"
# TUI 客户端(Phase 3):ratatui 0.30 + crossterm 0.28 + reqwest(API/SSE)
ratatui = "0.30"
crossterm = { version = "0.28", features = ["events"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
netstat2 = "0.11.2"
strip-ansi-escapes = "0.2.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 不设 panic = "abort",保留 unwind 支持优雅关闭(对齐 rs-iot)

[package]
name = "warden"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "A process supervisor daemon (supervisord/pm2-style) for the edge"
repository = "https://github.com/viccom/warden"
readme = "README.md"

[lib]
name = "warden"
path = "src/lib.rs"

[[bin]]
name = "warden"
path = "src/main.rs"

# 测试辅助二进制(被 warden 作为被监护进程启动,验证优雅停止信号链路)
[[bin]]
name = "graceful_target"
path = "tests/helpers/graceful_target.rs"

[dependencies]
# 与 rs-iot 同版本栈,便于统一维护
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
sysinfo = "0.32"
directories = "5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 不设 panic = "abort",保留 unwind 支持优雅关闭(对齐 rs-iot)

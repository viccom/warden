# warden 开箱即用示例(Linux)
#
# 发行包里本文件被命名为 config/services.toml —— 放在可执行文件同级的 config/
# 目录下会被自动发现(查找链第 2 级),所以解压后直接 `./warden run` 即可。
#
# 用法:
#   ./warden run                                  # 自动发现 config/services.toml
#   ./warden run --config config/services.toml    # 显式指定(等价)
#   curl http://127.0.0.1:8789/api/v1/health      # 探活(浏览器打开同地址是 Web UI)
#
# 全字段参考与生产模板:config/services.example.toml
# AI Agent 操作手册:AGENT-GUIDE.md

[daemon]
api_bind   = "127.0.0.1:8789"   # HTTP API + 内置 Web UI 监听地址
auth_token = ""                 # 留空 = 不鉴权(仅适合本机/内网);对外暴露前务必设置
data_dir   = "./data"           # 运行数据根目录(相对配置基准目录,即包根)
log_dir    = "./logs"           # warden 自身日志目录(按日滚动)

# ── 演示 1:每 2 秒打印一行心跳 ────────────────────────────────
# 验证:日志采集(API 读日志)、优雅停止(CTRL-C/SIGTERM 后进程组被回收)。
[[service]]
name                  = "demo-heartbeat"
display_name          = "心跳演示"
description           = "每 2 秒输出一行;验证日志采集与优雅停止"
command               = "sh"
args                  = ["-c", "i=0; while true; do i=$((i+1)); echo \"heartbeat #$i $(date '+%F %T')\"; sleep 2; done"]
auto_start            = true    # daemon 启动时自动拉起
auto_restart          = true    # 崩溃后按退避策略重启(默认 1s 起 ×2,上限 60s)
graceful_timeout_secs = 5       # 发 SIGTERM 后等 5s,超时强杀进程组

# ── 演示 2:监听端口的真实服务(需本机有 python3)────────────────
# 验证:端口发现(listening_ports)、TCP 健康检查(health)、UI 直达按钮(ui_url)。
# 去掉下面 [[service]] 到 health 行的注释即可启用。

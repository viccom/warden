<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warden</title>
<style>
  :root {
    --bg: #15151f; --panel: #1e1e2b; --panel2: #262636; --border: #33334a;
    --text: #e6e9f2; --sub: #9aa0b4; --muted: #6b7086;
    --green: #57d9a3; --red: #ff6b81; --yellow: #ffd479; --blue: #5aa7ff;
    --blue-dim: #3a5f8f;
    --radius: 12px;
    --font: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.55;
         background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── 顶栏 ── */
  header { display: flex; align-items: center; gap: 20px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .brand small { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .health { display: flex; align-items: center; gap: 8px; color: var(--sub); font-size: 14px; }
  .health .stat { color: var(--text); }
  .grow { flex: 1; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
         padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;
         font-family: inherit; transition: background .15s; }
  .btn:hover { background: #30304a; }
  .btn.primary { background: var(--blue); border-color: transparent; color: #0d1420; font-weight: 600; }
  .btn.primary:hover { background: #6fb3ff; }
  .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: rgba(255,107,129,.12); }
  .btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 6px; }
  .token { display: flex; gap: 8px; align-items: center; }
  .token input { background: var(--bg); border: 1px solid var(--border); color: var(--text);
                 padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; width: 190px; outline: none; }
  .token input:focus { border-color: var(--blue-dim); }

  /* ── 主区 ── */
  main { flex: 1; display: flex; overflow: hidden; padding: 16px; gap: 16px; }

  /* 左:服务列表 */
  aside { width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
          background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
          overflow: hidden; }
  .side-title { padding: 14px 18px; font-size: 14px; font-weight: 600; color: var(--sub);
                border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .side-title .count { background: var(--panel2); border-radius: 20px; padding: 2px 10px; font-size: 12px; color: var(--text); }
  #services { flex: 1; overflow-y: auto; padding: 8px; }
  .svc { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
         cursor: pointer; transition: border-color .15s, background .15s; }
  .svc:hover { border-color: #4a4a6a; }
  .svc.sel { border-color: var(--blue); background: rgba(90,167,255,.06); }
  .svc .top { display: flex; align-items: center; gap: 10px; }
  .svc .nm { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .svc .meta { margin-top: 6px; display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
  .svc .acts { margin-top: 10px; display: flex; gap: 6px; }
  .svc .acts button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
                      padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-family: inherit; }
  .svc .acts button:hover { border-color: var(--blue); color: var(--blue); }
  .svc .acts button.del:hover { border-color: var(--red); color: var(--red); }
  .empty { color: var(--muted); padding: 28px; text-align: center; font-size: 14px; }

  /* 状态徽章 / 健康点 */
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
           padding: 3px 10px; border-radius: 20px; }
  .badge.running { background: rgba(87,217,163,.14); color: var(--green); }
  .badge.stopped { background: rgba(107,112,134,.16); color: var(--sub); }
  .badge.failed { background: rgba(255,107,129,.14); color: var(--red); }
  .badge.restarting, .badge.starting, .badge.stopping { background: rgba(255,212,121,.14); color: var(--yellow); }
  .badge .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .hdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 2px; }
  .hdot.healthy { background: var(--green); } .hdot.unhealthy { background: var(--red); }
  .hdot.unknown { background: var(--muted); }

  /* 右:日志面板 */
  .logpanel { flex: 1; display: flex; flex-direction: column; min-width: 0;
              background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .logbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px;
            border-bottom: 1px solid var(--border); }
  .logbar #logtitle { font-size: 16px; font-weight: 600; }
  .logbar .hint { color: var(--muted); font-size: 12.5px; }
  .logbar input[type=text] { background: var(--bg); border: 1px solid var(--border); color: var(--text);
                             padding: 5px 10px; border-radius: 6px; font-family: inherit; font-size: 13px;
                             width: 150px; outline: none; }
  .logbar input[type=text]:focus { border-color: var(--blue-dim); }
  .logbar select { background: var(--bg); border: 1px solid var(--border); color: var(--text);
                    padding: 5px 8px; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; }
  .line.err .text { color: var(--red); }
  .line.lv-error .text { color: var(--red); }
  .line.lv-warn .text { color: var(--yellow); }
  .line.lv-debug .text { color: var(--muted); }
  #logs { flex: 1; overflow-y: auto; padding: 12px 18px; font-size: 13.5px; line-height: 1.7;
          font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; }
  .line { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-all; }
  .line .ts { color: var(--muted); flex-shrink: 0; }

  /* ── 模态表单 ── */
  .overlay { position: fixed; inset: 0; background: rgba(8,8,14,.7); backdrop-filter: blur(3px);
             display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
           padding: 24px 28px; width: 580px; max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal h3 { margin: 0 0 20px; font-size: 18px; }
  .modal .field { margin-bottom: 14px; }
  .modal label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 500; }
  .modal input[type=text], .modal input[type=number], .modal textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; }
  .modal input:focus, .modal textarea:focus { border-color: var(--blue-dim); }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal .row { display: flex; gap: 14px; }
  .modal .row .field { flex: 1; }
  .modal .chk { display: flex; gap: 22px; align-items: center; color: var(--sub); font-size: 14px; }
  .modal .chk input { accent-color: var(--blue); width: 15px; height: 15px; margin-right: 5px; }
  .modal .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* ── Toast ── */
  #toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
           background: #2d2d40; color: var(--text); padding: 12px 24px; border-radius: 10px;
           font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45); border: 1px solid var(--border);
           opacity: 0; transition: opacity .25s; z-index: 20; max-width: 80%; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); color: #160d10; border-color: transparent; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="brand">warden<small id="ver"></small></div>
  <div class="health">
    <span id="hdot" class="hdot healthy"></span>
    <span id="htext">连接中…</span>
    <span class="stat" id="count"></span>
  </div>
  <div class="grow"></div>
  <div class="token">
    <input id="tok" type="password" placeholder="token(可选)">
    <button class="btn" onclick="saveToken()">保存</button>
  </div>
</header>

<main>
  <aside>
    <div class="side-title">
      <span>服务列表 <span class="count" id="svcCount">0</span></span>
      <button class="btn primary sm" onclick="openForm()">＋ 新增服务</button>
    </div>
    <div id="services"><div class="empty">加载中…</div></div>
  </aside>
  <section class="logpanel">
    <div class="logbar">
      <span id="logtitle">选择左侧服务查看日志</span>
      <span class="hint" id="loghint"></span>
      <span class="grow"></span>
      <input id="logFilter" type="text" placeholder="过滤日志…" oninput="onLogFilter()">
      <select id="logLevel" onchange="onLogFilter()">
        <option value="">全部等级</option>
        <option value="error">error</option>
        <option value="warn">warn</option>
        <option value="info">info</option>
        <option value="debug">debug</option>
        <option value="unknown">未知</option>
      </select>
      <button class="btn sm" id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
      <button class="btn sm" onclick="clearLog()">清空</button>
    </div>
    <div id="logs"><div class="empty">未选择服务</div></div>
  </section>
</main>

<!-- 服务编辑表单(新增/编辑共用) -->
<div class="overlay" id="formOverlay" style="display:none">
  <div class="modal">
    <h3 id="formTitle">新增服务</h3>
    <div class="field"><label>名称 *</label><input id="f_name" type="text" placeholder="唯一标识(不可含 / \ : * ? &quot; &lt; &gt; |)"></div>
    <div class="field"><label>可执行文件路径 *</label><input id="f_command" type="text" placeholder="如 E:/rsiot-field/bin/rs-iot.exe"></div>
    <div class="field"><label>参数(每行一个)</label><textarea id="f_args" placeholder="-n&#10;60&#10;127.0.0.1"></textarea></div>
    <div class="row">
      <div class="field"><label>工作目录</label><input id="f_workdir" type="text" placeholder="可选"></div>
      <div class="field"><label>优雅停止超时(秒)</label><input id="f_graceful" type="number" value="10" min="0"></div>
    </div>
    <div class="field"><label>输出编码(如 gbk;空=UTF-8)</label><input id="f_encoding" type="text" placeholder="可选"></div>
    <div class="row">
      <div class="field"><label>分组(可选标签)</label><input id="f_group" type="text" placeholder="如 core"></div>
      <div class="field"><label>启动优先级(小者先启动)</label><input id="f_priority" type="number" value="0" min="0"></div>
    </div>
    <div class="field"><label>环境变量(每行 KEY=VAL)</label><textarea id="f_env" placeholder="RUST_LOG=debug&#10;TZ=Asia/Shanghai"></textarea></div>
    <div class="chk">
      <label><input id="f_autostart" type="checkbox"> 自动启动</label>
      <label><input id="f_autorestart" type="checkbox"> 崩溃自动重启</label>
    </div>
    <div class="err" id="formErr"></div>
    <div class="actions">
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn primary" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
// ── 状态 ─────────────────────────────────────────────
let token = localStorage.getItem('warden_token') || '';
let selected = null;
let currentList = [];
let es = null;            // EventSource(SSE,无 token 时)
let pollTimer = null;     // 降级轮询(有 token 时)
let lastTs = '';          // 轮询去重水位
let paused = false;
let svcTimer = null;

// ── API 辅助 ─────────────────────────────────────────
function authHeaders() {
  const h = {};
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
async function api(path, method = 'GET') {
  const r = await fetch(path, { method, headers: authHeaders() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const enc = encodeURIComponent;

// ── 顶栏:health ─────────────────────────────────────
async function loadHealth() {
  try {
    const h = await api('/api/v1/health');
    document.getElementById('hdot').className = 'hdot ' + (h.status === 'ok' ? 'healthy' : 'unhealthy');
    document.getElementById('htext').textContent = h.status === 'ok' ? '连接正常' : '连接异常';
    document.getElementById('count').textContent = h.running + ' 运行 · ' + h.services + ' 服务 · ' + h.failed + ' 失败';
    document.getElementById('ver').textContent = 'v' + h.version;
  } catch (e) {
    document.getElementById('hdot').className = 'hdot unhealthy';
    document.getElementById('htext').textContent = '连接失败(token?)';
  }
}

// ── 左栏:服务列表 ───────────────────────────────────
async function loadServices() {
  try {
    const data = await api('/api/v1/services');
    currentList = data.services || [];
    document.getElementById('svcCount').textContent = currentList.length;
    renderServices(currentList);
  } catch (e) {
    const hint = e.message && e.message.includes('401')
      ? '需要鉴权:请在上方填写 token 并保存'
      : e.message || String(e);
    document.getElementById('services').innerHTML =
      '<div class="empty">加载失败:' + hint + '</div>';
  }
}
function renderServices(list) {
  const box = document.getElementById('services');
  box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="empty">暂无服务,点击右上角「新增服务」</div>'; return; }
  for (const s of list) {
    const st = (s.state && s.state.state) || 'unknown';
    const isRun = st === 'running';
    const row = document.createElement('div');
    row.className = 'svc' + (s.name === selected ? ' sel' : '');
    row.onclick = () => selectService(s.name);

    const top = document.createElement('div');
    top.className = 'top';
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = s.display_name || s.name;
    nm.title = s.name;
    const badge = document.createElement('span');
    badge.className = 'badge ' + st;
    badge.innerHTML = '<span class="d"></span>' + st;
    const hst = (s.health && s.health.status) || 'unknown';
    const hd = document.createElement('span');
    hd.className = 'hdot ' + hst;
    hd.title = '健康:' + hst;
    top.append(nm, badge, hd);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = [
      s.group ? '[' + s.group + ']' : '',
      s.priority ? 'P' + s.priority : '',
      s.state && s.state.pid ? 'PID ' + s.state.pid : '',
      'CPU ' + (s.metrics ? s.metrics.cpu_percent.toFixed(1) : '0.0') + '%',
      '内存 ' + (s.metrics ? Math.round(s.metrics.memory_kb / 1024) : 0) + ' MB',
      '重启 ' + s.restart_count,
      (s.listening_ports || []).map(p => p.proto + ':' + p.local_port).join(' '),
    ].filter(Boolean).join(' · ');

    const acts = document.createElement('div');
    acts.className = 'acts';
    const b1 = document.createElement('button');
    b1.textContent = isRun ? '停止' : '启动';
    b1.onclick = (ev) => { ev.stopPropagation(); startStop(s.name, isRun ? 'stop' : 'start'); };
    const b2 = document.createElement('button');
    b2.textContent = '编辑';
    b2.onclick = (ev) => { ev.stopPropagation(); openForm(s.name); };
    const b3 = document.createElement('button');
    b3.className = 'del';
    b3.textContent = '删除';
    b3.onclick = (ev) => { ev.stopPropagation(); deleteService(s.name); };
    acts.append(b1, b2, b3);

    row.append(top, meta, acts);
    box.appendChild(row);
  }
}

// ── 右栏:选中服务 + 日志流 ──────────────────────────
function selectService(name) {
  if (selected === name) return;
  selected = name;
  lastTs = '';
  closeStream();
  document.getElementById('logtitle').textContent = name;
  // 切换服务:重置日志过滤
  document.getElementById('logFilter').value = '';
  document.getElementById('logLevel').value = '';
  logFilter = ''; logLevel = '';
  clearLog(true);
  // 先拉历史快照
  api('/api/v1/services/' + enc(name) + '/logs?tail=200').then(d => {
    for (const l of d.lines) appendLog(l);
    if (d.lines.length) lastTs = d.lines[d.lines.length - 1].ts;
    updateLogHint(document.getElementById('logs').childNodes.length);
    scrollBottom();
  }).catch(() => {});
  openStream(name);
  renderServices(currentList);
}
function openStream(name) {
  closeStream();
  if (token) {
    // EventSource 不能设 header → 有 token 时降级轮询
    pollTimer = setInterval(pollLogs, 1500);
    pollLogs();
  } else {
    es = new EventSource('/api/v1/services/' + enc(name) + '/logs/stream');
    es.addEventListener('log', ev => {
      try {
        const line = JSON.parse(ev.data);
        appendLog(line);
        if (!paused) scrollBottom();
      } catch (_) {}
    });
    // 断线浏览器自动重连,无需处理 onerror
  }
}
async function pollLogs() {
  if (!selected) return;
  try {
    const d = await api('/api/v1/services/' + enc(selected) + '/logs?tail=80');
    let added = false;
    for (const l of d.lines) {
      if (!lastTs || l.ts > lastTs) { appendLog(l); added = true; }
    }
    if (d.lines.length) lastTs = d.lines[d.lines.length - 1].ts;
    if (added && !paused) scrollBottom();
  } catch (_) {}
}
function closeStream() {
  if (es) { es.close(); es = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ── 日志渲染(缓冲 + 过滤 + 增量 DOM,textContent 防 XSS)────────
// 高频日志性能:行先进 JS 缓冲(上限 2000),过滤时不匹配的行不建 DOM 节点
// (缓冲保留,清过滤即恢复);DOM 上限 1500 行,超出批量删首行。无需虚拟滚动/
// Canvas——本地监护每秒几十行场景增量 DOM 足够;若未来达每秒千行再升级虚拟滚动。
let logBuf = [];       // 全量缓冲(上限 LOG_BUF_MAX)
let logFilter = '';    // 关键词(大小写不敏感)
let logLevel = '';    // 等级过滤(''=全部)
const LOG_BUF_MAX = 2000;
const LOG_DOM_MAX = 1500;

function matchLog(line) {
  if (logLevel && (line.level || 'unknown') !== logLevel) return false;
  if (logFilter && !line.text.toLowerCase().includes(logFilter)) return false;
  return true;
}
function appendLogDom(box, line) {
  const div = document.createElement('div');
  // 等级着色:error 红 / warn 黄 / debug 灰;stderr 且未知等级时保持红(原行为)
  const lv = line.level || 'unknown';
  const cls = lv === 'error' || lv === 'warn' || lv === 'debug'
    ? 'lv-' + lv
    : (line.stream === 'stderr' ? 'err' : 'out');
  div.className = 'line ' + cls;
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = line.ts ? new Date(line.ts).toLocaleTimeString() : '';
  const txt = document.createElement('span');
  txt.className = 'text';
  txt.textContent = line.text;
  div.append(ts, txt);
  box.appendChild(div);
}
function updateLogHint(shown) {
  const h = document.getElementById('loghint');
  const total = logBuf.length;
  if (logFilter || logLevel) {
    h.textContent = '显示 ' + shown + '/' + total + ' 行' + (logLevel ? ' · 等级 ' + logLevel : '') + (logFilter ? ' · 匹配 "' + logFilter + '"' : '');
  } else {
    h.textContent = '';
  }
}
function appendLog(line) {
  logBuf.push(line);
  if (logBuf.length > LOG_BUF_MAX) {
    logBuf.shift();
    // 仅无过滤时 DOM 与缓冲一一对应,同步删首行(过滤模式由 rebuildLogs 全量重建)
    if (!logFilter && !logLevel) {
      const box = document.getElementById('logs');
      if (box.firstChild && !box.firstChild.classList.contains('empty')) box.removeChild(box.firstChild);
    }
  }
  if (!matchLog(line)) return; // 过滤不匹配:不入 DOM
  const box = document.getElementById('logs');
  if (box.firstChild && box.firstChild.classList.contains('empty')) box.innerHTML = '';
  appendLogDom(box, line);
  while (box.childNodes.length > LOG_DOM_MAX) box.removeChild(box.firstChild);
  updateLogHint(box.childNodes.length);
  if (!paused) scrollBottom();
}
// 过滤条件变化:全量重建可见区(保留滚动位置;原在底部则保持底部)
function rebuildLogs() {
  const box = document.getElementById('logs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = '';
  let shown = 0;
  for (const l of logBuf) {
    if (matchLog(l)) { appendLogDom(box, l); shown++; }
  }
  updateLogHint(shown);
  box.scrollTop = atBottom ? box.scrollHeight : 0;
}
function onLogFilter() {
  logFilter = document.getElementById('logFilter').value.trim().toLowerCase();
  logLevel = document.getElementById('logLevel').value;
  rebuildLogs();
}
function scrollBottom() {
  const box = document.getElementById('logs');
  box.scrollTop = box.scrollHeight;
}
function clearLog(keepPlaceholder) {
  logBuf = [];
  const box = document.getElementById('logs');
  box.innerHTML = keepPlaceholder ? '<div class="empty">加载日志中…</div>' : '';
  updateLogHint(0);
}

// ── 操作:start / stop ───────────────────────────────
async function startStop(name, action) {
  try {
    await fetch('/api/v1/services/' + enc(name) + '/' + action, { method: 'POST', headers: authHeaders() });
    showToast(action === 'stop' ? '已停止:' + name : '已启动:' + name);
    loadServices();
  } catch (e) { showToast(action + ' 失败:' + e.message, true); }
}

// ── 顶栏控制 ─────────────────────────────────────────
function saveToken() {
  token = document.getElementById('tok').value.trim();
  localStorage.setItem('warden_token', token);
  if (selected) selectService(selected);
  loadHealth(); loadServices();
}

// ── 新增/编辑服务表单 ────────────────────────────────
let editingName = null; // null=新增;否则=编辑的服务名
function openForm(name) {
  editingName = name || null;
  document.getElementById('formErr').textContent = '';
  document.getElementById('formTitle').textContent = name ? '编辑服务:' + name : '新增服务';
  ['f_name','f_command','f_args','f_workdir','f_encoding','f_env','f_group'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_graceful').value = '10';
  document.getElementById('f_priority').value = '0';
  document.getElementById('f_autostart').checked = false;
  document.getElementById('f_autorestart').checked = false;
  if (name) {
    // 编辑:拉完整配置预填
    api('/api/v1/services/' + enc(name) + '/config').then(cfg => {
      document.getElementById('f_name').value = cfg.name || '';
      document.getElementById('f_name').disabled = true; // PUT 要求 body.name==路径名
      document.getElementById('f_command').value = cfg.command || '';
      document.getElementById('f_args').value = (cfg.args || []).join('\n');
      document.getElementById('f_workdir').value = cfg.working_dir || '';
      document.getElementById('f_graceful').value = cfg.graceful_timeout_secs ?? 10;
      document.getElementById('f_encoding').value = cfg.output_encoding || '';
      document.getElementById('f_group').value = cfg.group || '';
      document.getElementById('f_priority').value = cfg.priority ?? 0;
      document.getElementById('f_env').value = Object.entries(cfg.environment || {}).map(([k,v]) => k + '=' + v).join('\n');
      document.getElementById('f_autostart').checked = !!cfg.auto_start;
      document.getElementById('f_autorestart').checked = !!cfg.auto_restart;
    }).catch(e => showToast('加载配置失败:' + e.message, true));
  } else {
    document.getElementById('f_name').disabled = false;
  }
  document.getElementById('formOverlay').style.display = 'flex';
}
function closeForm() {
  document.getElementById('formOverlay').style.display = 'none';
}
function submitForm() {
  const name = document.getElementById('f_name').value.trim();
  const command = document.getElementById('f_command').value.trim();
  if (!name || !command) { document.getElementById('formErr').textContent = '名称和命令必填'; return; }
  const cfg = {
    name,
    command,
    args: document.getElementById('f_args').value.split('\n').map(s => s.trim()).filter(Boolean),
    working_dir: document.getElementById('f_workdir').value.trim() || null,
    graceful_timeout_secs: parseInt(document.getElementById('f_graceful').value) || 10,
    output_encoding: document.getElementById('f_encoding').value.trim() || null,
    group: document.getElementById('f_group').value.trim() || null,
    priority: parseInt(document.getElementById('f_priority').value) || 0,
    auto_start: document.getElementById('f_autostart').checked,
    auto_restart: document.getElementById('f_autorestart').checked,
    environment: {},
  };
  // 环境变量 KEY=VAL 每行
  for (const line of document.getElementById('f_env').value.split('\n')) {
    const i = line.indexOf('=');
    if (i > 0) cfg.environment[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  const method = editingName ? 'PUT' : 'POST';
  const url = editingName ? '/api/v1/services/' + enc(editingName) : '/api/v1/services';
  fetch(url, { method, headers: Object.assign({'Content-Type': 'application/json'}, authHeaders()), body: JSON.stringify(cfg) })
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((body && body.message) || ('HTTP ' + r.status));
      closeForm();
      showToast((editingName ? '已更新:' : '已创建:') + name);
      loadServices();
    })
    .catch(e => { document.getElementById('formErr').textContent = '保存失败:' + e.message; });
}
function deleteService(name) {
  if (!confirm('确认删除服务「' + name + '」?(运行中不可删)')) return;
  fetch('/api/v1/services/' + enc(name), { method: 'DELETE', headers: authHeaders() })
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((body && body.message) || ('HTTP ' + r.status));
      if (selected === name) { selected = null; closeStream(); document.getElementById('logtitle').textContent = '选择左侧服务查看日志'; }
      showToast('已删除:' + name);
      loadServices();
    })
    .catch(e => showToast('删除失败:' + e.message, true));
}

// ── toast ────────────────────────────────────────────
let toastTimer = null;
function showToast(text, isErr) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = isErr ? 'show err' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
  if (!paused) scrollBottom();
}

// ── 启动 ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tok').value = token;
  loadHealth(); loadServices();
  svcTimer = setInterval(() => { loadHealth(); loadServices(); }, 2000);
});
window.addEventListener('beforeunload', closeStream);
</script>

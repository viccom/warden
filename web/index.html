<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>warden</title>
<style>
  :root {
    --bg: #1e1e2e; --surface: #313244; --surface2: #45475a;
    --text: #cdd6f4; --sub: #a6adc8; --muted: #6c7086;
    --green: #a6e3a1; --red: #f38ba8; --yellow: #f9e2af; --blue: #89b4fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           background: var(--surface); border-bottom: 1px solid var(--surface2); }
  .brand { font-weight: 700; font-size: 16px; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .health { color: var(--sub); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .token { margin-left: auto; display: flex; gap: 6px; }
  .token input { background: var(--bg); border: 1px solid var(--surface2); color: var(--text);
                 padding: 4px 8px; border-radius: 4px; font-family: inherit; width: 160px; }
  .token button { background: var(--surface2); color: var(--text); border: none;
                  padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  main { flex: 1; display: flex; overflow: hidden; }
  aside { width: 260px; border-right: 1px solid var(--surface2); overflow-y: auto; background: var(--bg); }
  .svc { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
         border-bottom: 1px solid #2a2a3c; }
  .svc:hover { background: var(--surface); }
  .svc.sel { background: var(--surface2); }
  .svcname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pid { color: var(--muted); font-size: 11px; }
  .btns button { background: var(--surface2); color: var(--text); border: none;
                 padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btns button:hover { background: var(--blue); color: var(--bg); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
  .dot.running { background: var(--green); } .dot.stopped { background: var(--muted); }
  .dot.failed { background: var(--red); } .dot.restarting { background: var(--yellow); }
  .dot.starting, .dot.stopping { background: var(--blue); }
  .logpanel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .logbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            background: var(--surface); border-bottom: 1px solid var(--surface2); }
  .logbar #logtitle { font-weight: 600; }
  .grow { flex: 1; }
  .logbar button { background: var(--surface2); color: var(--text); border: none;
                   padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; }
  #logs { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12.5px; line-height: 1.5; }
  .line { display: flex; gap: 8px; white-space: pre-wrap; word-break: break-all; }
  .line .ts { color: var(--muted); flex-shrink: 0; }
  .line.err .text { color: var(--red); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .addbtn { background: var(--blue); color: var(--bg); border: none; padding: 4px 12px;
            border-radius: 4px; cursor: pointer; font-weight: 600; }
  /* modal 表单 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
             align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--surface); border: 1px solid var(--surface2); border-radius: 8px;
           padding: 18px 22px; width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 14px; }
  .modal .field { margin-bottom: 10px; }
  .modal label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 3px; }
  .modal input[type=text], .modal input[type=number], .modal textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--surface2); color: var(--text);
    padding: 6px 8px; border-radius: 4px; font-family: inherit; }
  .modal textarea { min-height: 56px; resize: vertical; }
  .modal .row { display: flex; gap: 12px; }
  .modal .row .field { flex: 1; }
  .modal .chk { display: flex; gap: 18px; align-items: center; color: var(--sub); }
  .modal .chk label { display: inline; margin: 0; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal button { background: var(--surface2); color: var(--text); border: none;
                  padding: 6px 16px; border-radius: 4px; cursor: pointer; }
  .modal button.primary { background: var(--blue); color: var(--bg); font-weight: 600; }
  .modal button.danger { background: var(--red); color: var(--bg); }
  .modal .err { color: var(--red); font-size: 12px; min-height: 16px; margin-top: 8px; }
  /* toast */
  #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
           background: var(--surface2); color: var(--text); padding: 8px 18px; border-radius: 6px;
           font-size: 13px; opacity: 0; transition: opacity .25s; z-index: 20; max-width: 80%; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); color: var(--bg); }
</style>
</head>
<body>
<header>
  <div class="brand">warden <small id="ver"></small></div>
  <div class="health"><span id="hdot" class="dot"></span><span id="htext">连接中…</span> · <span id="count"></span></div>
  <button class="addbtn" onclick="openForm()">+ 新增服务</button>
  <div class="token">
    <input id="tok" type="password" placeholder="token(可选)">
    <button onclick="saveToken()">保存</button>
  </div>
</header>
<main>
  <aside id="services"><div class="empty">加载中…</div></aside>
  <section class="logpanel">
    <div class="logbar">
      <span id="logtitle">选择左侧服务查看日志</span>
      <span class="grow"></span>
      <button id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
      <button onclick="clearLog()">清空</button>
    </div>
    <div id="logs"><div class="empty">未选择服务</div></div>
  </section>
</main>

<!-- 服务编辑表单(新增/编辑共用) -->
<div class="overlay" id="formOverlay" style="display:none">
  <div class="modal">
    <h3 id="formTitle">新增服务</h3>
    <div class="field"><label>名称 *</label><input id="f_name" type="text" placeholder="唯一标识(不可含 / \\ : * ? \" < > |)"></div>
    <div class="field"><label>可执行文件路径 *</label><input id="f_command" type="text" placeholder="如 E:/rsiot-field/bin/rs-iot.exe"></div>
    <div class="field"><label>参数(每行一个)</label><textarea id="f_args" placeholder="-n&#10;60&#10;127.0.0.1"></textarea></div>
    <div class="row">
      <div class="field"><label>工作目录</label><input id="f_workdir" type="text" placeholder="可选"></div>
      <div class="field"><label>优雅停止超时(秒)</label><input id="f_graceful" type="number" value="10" min="0"></div>
    </div>
    <div class="field"><label>输出编码(如 gbk;空=UTF-8)</label><input id="f_encoding" type="text" placeholder="可选"></div>
    <div class="field"><label>环境变量(每行 KEY=VAL)</label><textarea id="f_env" placeholder="RUST_LOG=debug&#10;TZ=Asia/Shanghai"></textarea></div>
    <div class="chk">
      <label><input id="f_autostart" type="checkbox"> 自动启动</label>
      <label><input id="f_autorestart" type="checkbox"> 崩溃自动重启</label>
    </div>
    <div class="err" id="formErr"></div>
    <div class="actions">
      <button onclick="closeForm()">取消</button>
      <button class="primary" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
// ── 状态 ─────────────────────────────────────────────
let token = localStorage.getItem('warden_token') || '';
let selected = null;
let currentList = [];
let es = null;            // EventSource(SSE,无 token 时)
let pollTimer = null;     // 降级轮询(有 token 时)
let lastTs = '';          // 轮询去重水位
let paused = false;
let svcTimer = null;

// ── API 辅助 ─────────────────────────────────────────
function authHeaders() {
  const h = {};
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
async function api(path, method = 'GET') {
  const r = await fetch(path, { method, headers: authHeaders() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const enc = encodeURIComponent;

// ── 顶栏:health ─────────────────────────────────────
async function loadHealth() {
  try {
    const h = await api('/api/v1/health');
    document.getElementById('hdot').className = 'dot ' + (h.status === 'ok' ? 'running' : 'failed');
    document.getElementById('htext').textContent = h.status;
    document.getElementById('count').textContent = h.running + ' running / ' + h.services + ' / ' + h.failed + ' failed';
    document.getElementById('ver').textContent = 'v' + h.version;
  } catch (e) {
    document.getElementById('hdot').className = 'dot failed';
    document.getElementById('htext').textContent = '连接失败(token?)';
  }
}

// ── 左栏:服务列表 ───────────────────────────────────
async function loadServices() {
  try {
    const data = await api('/api/v1/services');
    currentList = data.services || [];
    renderServices(currentList);
  } catch (e) {
    // 静默失败会让列表永远"加载中"(实测:配了 token 未填时 401)——明确提示
    const hint = e.message && e.message.includes('401')
      ? '需要鉴权:请在上方填写 token 并保存'
      : e.message || String(e);
    document.getElementById('services').innerHTML =
      '<div class="empty">加载失败:' + hint + '</div>';
  }
}
function renderServices(list) {
  const box = document.getElementById('services');
  box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="empty">无服务</div>'; return; }
  for (const s of list) {
    const st = (s.state && s.state.state) || 'unknown';
    const row = document.createElement('div');
    row.className = 'svc' + (s.name === selected ? ' sel' : '');
    row.onclick = () => selectService(s.name);
    // 状态点 + 健康点(●healthy 绿 / unhealthy 红 / unknown 灰)
    const dot = document.createElement('span');
    dot.className = 'dot ' + st;
    const hd = document.createElement('span');
    const hst = (s.health && s.health.status) || 'unknown';
    hd.className = 'dot ' + (hst === 'healthy' ? 'running' : hst === 'unhealthy' ? 'failed' : 'stopped');
    hd.title = '健康:' + hst;
    const name = document.createElement('span');
    name.className = 'svcname';
    name.textContent = s.display_name || s.name;
    name.title = s.name;
    const pid = document.createElement('span');
    pid.className = 'pid';
    pid.textContent = s.state && s.state.pid ? '#' + s.state.pid : '';
    const btns = document.createElement('span');
    btns.className = 'btns';
    const isRun = st === 'running';
    const b = document.createElement('button');
    b.textContent = isRun ? 'stop' : 'start';
    b.onclick = (ev) => { ev.stopPropagation(); startStop(s.name, isRun ? 'stop' : 'start'); };
    btns.appendChild(b);
    const eb = document.createElement('button');
    eb.textContent = '编辑';
    eb.onclick = (ev) => { ev.stopPropagation(); openForm(s.name); };
    btns.appendChild(eb);
    const db = document.createElement('button');
    db.textContent = '删';
    db.onclick = (ev) => { ev.stopPropagation(); deleteService(s.name); };
    btns.appendChild(db);
    row.append(dot, hd, name, pid, btns);
    box.appendChild(row);
  }
}

// ── 右栏:选中服务 + 日志流 ──────────────────────────
function selectService(name) {
  if (selected === name) return;
  selected = name;
  lastTs = '';
  closeStream();
  document.getElementById('logtitle').textContent = name;
  clearLog(true);
  // 先拉历史快照
  api('/api/v1/services/' + enc(name) + '/logs?tail=200').then(d => {
    for (const l of d.lines) appendLog(l);
    if (d.lines.length) lastTs = d.lines[d.lines.length - 1].ts;
    capLogs(); scrollBottom();
  }).catch(() => {});
  openStream(name);
  renderServices(currentList);
}
function openStream(name) {
  closeStream();
  if (token) {
    // EventSource 不能设 header → 有 token 时降级轮询
    pollTimer = setInterval(pollLogs, 1500);
    pollLogs();
  } else {
    es = new EventSource('/api/v1/services/' + enc(name) + '/logs/stream');
    es.addEventListener('log', ev => {
      try {
        const line = JSON.parse(ev.data);
        appendLog(line); capLogs();
        if (!paused) scrollBottom();
      } catch (_) {}
    });
    // 断线浏览器自动重连,无需处理 onerror
  }
}
async function pollLogs() {
  if (!selected) return;
  try {
    const d = await api('/api/v1/services/' + enc(selected) + '/logs?tail=80');
    let added = false;
    for (const l of d.lines) {
      if (!lastTs || l.ts > lastTs) { appendLog(l); added = true; }
    }
    if (d.lines.length) lastTs = d.lines[d.lines.length - 1].ts;
    if (added) { capLogs(); if (!paused) scrollBottom(); }
  } catch (_) {}
}
function closeStream() {
  if (es) { es.close(); es = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ── 日志渲染(textContent 防 XSS)─────────────────────
function appendLog(line) {
  const box = document.getElementById('logs');
  // 首次写入清掉"未选择服务"占位
  if (box.firstChild && box.firstChild.classList && box.firstChild.classList.contains('empty')) {
    box.innerHTML = '';
  }
  const div = document.createElement('div');
  div.className = 'line ' + (line.stream === 'stderr' ? 'err' : 'out');
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = line.ts ? new Date(line.ts).toLocaleTimeString() : '';
  const txt = document.createElement('span');
  txt.className = 'text';
  txt.textContent = line.text;
  div.append(ts, txt);
  box.appendChild(div);
}
function capLogs() {
  const box = document.getElementById('logs');
  while (box.childNodes.length > 1000) box.removeChild(box.firstChild);
}
function scrollBottom() {
  const box = document.getElementById('logs');
  box.scrollTop = box.scrollHeight;
}
function clearLog(keepPlaceholder) {
  const box = document.getElementById('logs');
  box.innerHTML = keepPlaceholder ? '<div class="empty">加载日志中…</div>' : '';
}

// ── 操作:start / stop ───────────────────────────────
async function startStop(name, action) {
  try {
    await fetch('/api/v1/services/' + enc(name) + '/' + action, { method: 'POST', headers: authHeaders() });
    loadServices();
  } catch (e) { alert(action + ' 失败:' + e.message); }
}

// ── 顶栏控制 ─────────────────────────────────────────
function saveToken() {
  token = document.getElementById('tok').value.trim();
  localStorage.setItem('warden_token', token);
  // token 变化需重建流(切换 SSE/轮询)
  if (selected) selectService(selected);
  loadHealth(); loadServices();
}

// ── 新增/编辑服务表单 ────────────────────────────────
let editingName = null; // null=新增;否则=编辑的服务名
function openForm(name) {
  editingName = name || null;
  document.getElementById('formErr').textContent = '';
  document.getElementById('formTitle').textContent = name ? '编辑服务:' + name : '新增服务';
  // 清空默认
  ['f_name','f_command','f_args','f_workdir','f_encoding','f_env'].forEach(id => {
    document.getElementById(id).value = id === 'f_graceful' ? '10' : '';
  });
  document.getElementById('f_graceful').value = '10';
  document.getElementById('f_autostart').checked = false;
  document.getElementById('f_autorestart').checked = false;
  if (name) {
    // 编辑:拉完整配置预填
    api('/api/v1/services/' + enc(name) + '/config').then(cfg => {
      document.getElementById('f_name').value = cfg.name || '';
      document.getElementById('f_name').disabled = true; // PUT 要求 body.name==路径名
      document.getElementById('f_command').value = cfg.command || '';
      document.getElementById('f_args').value = (cfg.args || []).join('\n');
      document.getElementById('f_workdir').value = cfg.working_dir || '';
      document.getElementById('f_graceful').value = cfg.graceful_timeout_secs ?? 10;
      document.getElementById('f_encoding').value = cfg.output_encoding || '';
      document.getElementById('f_env').value = Object.entries(cfg.environment || {}).map(([k,v]) => k + '=' + v).join('\n');
      document.getElementById('f_autostart').checked = !!cfg.auto_start;
      document.getElementById('f_autorestart').checked = !!cfg.auto_restart;
    }).catch(e => showToast('加载配置失败:' + e.message, true));
  } else {
    document.getElementById('f_name').disabled = false;
  }
  document.getElementById('formOverlay').style.display = 'flex';
}
function closeForm() {
  document.getElementById('formOverlay').style.display = 'none';
}
function submitForm() {
  const name = document.getElementById('f_name').value.trim();
  const command = document.getElementById('f_command').value.trim();
  if (!name || !command) { document.getElementById('formErr').textContent = '名称和命令必填'; return; }
  const cfg = {
    name,
    command,
    args: document.getElementById('f_args').value.split('\n').map(s => s.trim()).filter(Boolean),
    working_dir: document.getElementById('f_workdir').value.trim() || null,
    graceful_timeout_secs: parseInt(document.getElementById('f_graceful').value) || 10,
    output_encoding: document.getElementById('f_encoding').value.trim() || null,
    auto_start: document.getElementById('f_autostart').checked,
    auto_restart: document.getElementById('f_autorestart').checked,
    environment: {},
  };
  // 环境变量 KEY=VAL 每行
  for (const line of document.getElementById('f_env').value.split('\n')) {
    const i = line.indexOf('=');
    if (i > 0) cfg.environment[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  const method = editingName ? 'PUT' : 'POST';
  const url = editingName ? '/api/v1/services/' + enc(editingName) : '/api/v1/services';
  fetch(url, { method, headers: Object.assign({'Content-Type': 'application/json'}, authHeaders()), body: JSON.stringify(cfg) })
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((body && body.message) || ('HTTP ' + r.status));
      closeForm();
      showToast((editingName ? '已更新:' : '已创建:') + name);
      loadServices();
    })
    .catch(e => { document.getElementById('formErr').textContent = '保存失败:' + e.message; });
}
function deleteService(name) {
  if (!confirm('确认删除服务「' + name + '」?(运行中不可删)')) return;
  fetch('/api/v1/services/' + enc(name), { method: 'DELETE', headers: authHeaders() })
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error((body && body.message) || ('HTTP ' + r.status));
      if (selected === name) { selected = null; closeStream(); document.getElementById('logtitle').textContent = '选择左侧服务查看日志'; }
      showToast('已删除:' + name);
      loadServices();
    })
    .catch(e => showToast('删除失败:' + e.message, true));
}

// ── toast ────────────────────────────────────────────
let toastTimer = null;
function showToast(text, isErr) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = isErr ? 'show err' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ 继续' : '⏸ 暂停';
  if (!paused) scrollBottom();
}

// ── 启动 ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('tok').value = token;
  loadHealth(); loadServices();
  svcTimer = setInterval(() => { loadHealth(); loadServices(); }, 2000);
});
window.addEventListener('beforeunload', closeStream);
</script>
</body>
</html>
